<!doctype html>
<!-- Los %MARCADORES% los completa vite.config.ts con la marca (packages/brand). -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:title" content="%APP_NAME%" />
    <meta property="og:description" content="%APP_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de %APP_NAME% con un mate y el lema «%APP_SLOGAN%»" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%APP_NAME%" />
    <meta name="twitter:description" content="%APP_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og-cover.png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="%FONTS_HREF%" rel="stylesheet" />
    <title>%APP_NAME%</title>
    <script>%THEME_SCRIPT%</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
