name: Algo no anda
description: Un error concreto en la app
labels: ["bug"]
body:
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasó?
      description: Qué hiciste, qué esperabas y qué pasó en cambio.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para repetirlo
      placeholder: "1. Entré a Grupos\n2. Toqué…"
  - type: input
    id: donde
    attributes:
      label: Dispositivo y navegador
      placeholder: "iPhone 13, Safari / Android, Chrome / compu, Firefox"
  - type: textarea
    id: captura
    attributes:
      label: Capturas
      description: Si podés, sumá una. Tapá nombres y fotos de otras personas.
