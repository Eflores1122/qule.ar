# Bloque de nginx para mortero. Reemplazá DOMINIO por el dominio real.
# Copialo a /etc/nginx/sites-available/mortero, enlazalo en sites-enabled,
# probá con `nginx -t` y después corré certbot para el HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    # Fotos de hasta 12 MB (más margen)
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets del chat en vivo
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
