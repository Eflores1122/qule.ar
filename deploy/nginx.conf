# Bloque de nginx para mortero. Reemplazá DOMINIO por el dominio real.
# Copialo a /etc/nginx/sites-available/mortero, enlazalo en sites-enabled,
# probá con `nginx -t` y después corré certbot para el HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Las claves vacías dejan pasar las rutas que no corresponden a cada límite.
map $uri $qule_api_client {
    default "";
    ~^/api/ $binary_remote_addr;
}
map "$request_method:$uri" $qule_auth_client {
    default "";
    ~^POST:/api/auth/(sign-in|sign-up|request-password-reset|reset-password)(/|$) $binary_remote_addr;
}
map $uri $qule_socket_client {
    default "";
    ~^/socket\.io(/|$) $binary_remote_addr;
}

limit_req_zone $qule_api_client zone=qule_api:10m rate=20r/s;
limit_req_zone $qule_auth_client zone=qule_auth:10m rate=20r/m;
limit_req_zone $qule_socket_client zone=qule_socket:10m rate=30r/m;
limit_conn_zone $qule_socket_client zone=qule_socket_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    # Fotos de hasta 12 MB (más margen)
    client_max_body_size 15m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        limit_req zone=qule_api burst=40 nodelay;
        limit_req zone=qule_auth burst=10 nodelay;
        limit_req zone=qule_socket burst=20 nodelay;
        limit_conn qule_socket_conn 40;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets del chat en vivo
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
